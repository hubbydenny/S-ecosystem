name: FreeBSD CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.2"
          prepare: |
            pkg install -y gmake
          run: |
            gmake clean
            gmake CXX=clang++
            echo "=== sfetch tests ==="
            ./sfetch --logo freebsd
            ./sfetch --logo openbsd
            ./sfetch --logo void
            echo "=== scat test ==="
            echo "hello" | ./scat
            echo "=== sls test ==="
            ./sls /
